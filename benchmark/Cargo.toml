[package]
name = "benchmark"
version = "0.1.0"
authors = ["Matteo Santamaria"]
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"

[dependencies]
presolve = { path = ".." }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
mps = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.22", default-features = false, features = ["std", "ansi"] }
